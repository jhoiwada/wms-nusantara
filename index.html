<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PT Nusantara Logistik Distribusi — WMS Enterprise Portal</title>
  <meta http-equiv="refresh" content="2; url=http://localhost:3000">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 1rem;
      padding: 2.5rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    p {
      color: #a1a1aa;
      font-size: 0.9rem;
      line-height: 1.6;
      margin: 0 0 1.5rem 0;
    }
    .btn {
      display: inline-block;
      background: #f59e0b;
      color: #09090b;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      padding: 0.75rem 1.75rem;
      border-radius: 0.5rem;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #d97706;
    }
    .hint {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #27272a;
      font-size: 0.8rem;
      color: #71717a;
    }
    code {
      background: #27272a;
      color: #f59e0b;
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Next.js Application Gateway</div>
    <h1>PT Nusantara Logistik Distribusi</h1>
    <p>Aplikasi WMS ini berjalan di server Node.js / Next.js (port 3000), bukan server Apache/PHP biasa.</p>
    <a href="http://localhost:3000" class="btn" id="redirectBtn">Buka WMS di http://localhost:3000 &rarr;</a>
    <div class="hint">
      Otomatis mengalihkan dalam 2 detik...<br>
      Jika belum aktif, jalankan <code>npm run dev</code> di terminal.
    </div>
  </div>
  <script>
    setTimeout(function() {
      window.location.href = "http://localhost:3000";
    }, 1500);
  </script>
</body>
</html>
